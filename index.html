<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Autito AR en el Piso</title>
    <!-- Cargamos model-viewer de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: sans-serif;
        }

        /* El visor ocupa toda la pantalla */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Estilo del botón personalizado de AR */
        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #007bff, #00d2ff);
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 100;
        }

        #ar-button:active {
            transform: translateX(-50%) scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Visor 3D con AR activado -->
    <model-viewer id="obj-viewer"
        src="Baseauto.glb"
        alt="Autito 3D"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        bounds="tight">
        
        <!-- Botón para ingresar al modo Realidad Aumentada -->
        <button slot="ar-button" id="ar-button">
            📍 Colocar en mi piso
        </button>

    </model-viewer>

</body>
</html>
