<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pseudo-AR: Autito Fix</title>
    <!-- Cargamos model-viewer de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        model-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            z-index: 2;
            --poster-color: transparent;
        }

        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid white;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        button:active {
            background-color: rgba(255, 255, 255, 0.3);
        }

        #ios-permission-btn {
            display: none;
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- 1. Cámara -->
        <video id="camera-feed" autoplay playsinline muted></video>

        <!-- 2. Autito 3D con SUPER CORRECCIÓN -->
        <model-viewer id="obj-viewer"
            src="Baseauto.glb"
            alt="Autito 3D"
            camera-controls="false"
            interaction-prompt="none"
            shadow-intensity="1"
            
            /* --- LAS CORRECCIONES CLAVE ESTÁN AQUÍ --- */
            bounds="tight"             /* Forza el encuadre al modelo real */
            camera-target="auto auto auto" /* Centra el modelo automáticamente */
            auto-rotate                /* Ayuda a verlo si está desorientado */
            loading="eager"            /* Carga lo más rápido posible */
            >
        </model-viewer>

        <!-- 3. Controles -->
        <div id="ui-container">
            <button id="ios-permission-btn">Activar Sensores (iOS)</button>
            <button id="place-btn">Colocar Objeto</button>
            <button id="reset-btn" style="display: none;">Colocar otro</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const viewer = document.getElementById('obj-viewer');
        const placeBtn = document.getElementById('place-btn');
        const resetBtn = document.getElementById('reset-btn');
        const iosBtn = document.getElementById('ios-permission-btn');

        let objectPlaced = false;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" },
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accediendo a la cámara:", err);
                alert("No se pudo acceder a la cámara. Revisa los permisos.");
            }
        }

        // Función para fijar la orientación
        placeBtn.addEventListener('click', () => {
            if (!objectPlaced) {
                objectPlaced = true;
                placeBtn.style.display = 'none';
                resetBtn.style.display = 'block';
                viewer.shadowIntensity = 1.5;
                viewer.autoRotate = false; // Detiene la rotación al colocarlo
            }
        });

        // Función para reiniciar
        resetBtn.addEventListener('click', () => {
            objectPlaced = false;
            resetBtn.style.display = 'none';
            placeBtn.style.display = 'block';
            viewer.shadowIntensity = 1;
            viewer.autoRotate = true; // Vuelve a rotar
        });

        // Manejo de la orientación con sensores
        function handleOrientation(event) {
            if (objectPlaced) return;

            const alpha = event.alpha || 0;
            const beta = event.beta || 0; 

            // Convertimos la orientación del sensor en órbita de cámara
            const clampedBeta = Math.max(0, Math.min(180, beta));
            viewer.cameraOrbit = `${alpha}deg ${clampedBeta}deg auto`;
        }

        // Configuración y permisos de sensores
        function setupSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Navegadores iOS (Safari, Chrome iOS)
                iosBtn.style.display = 'block';
                iosBtn.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response == 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                                iosBtn.style.display = 'none';
                                startCamera();
                            }
                        })
                        .catch(console.error);
                });
            } else {
                // Navegadores Android y otros
                window.addEventListener('deviceorientation', handleOrientation, true);
                startCamera();
            }
        }

        window.addEventListener('load', setupSensors);
    </script>
</body>
</html>
