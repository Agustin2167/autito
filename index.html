<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Autito AR - Piso Real</title>
    <!-- Cargamos model-viewer de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: sans-serif;
        }

        /* El visor ocupa toda la pantalla con fondo oscuro al inicio */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Botón personalizado para entrar en modo AR */
        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #007bff, #00d2ff);
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 100;
        }

        #ar-button:active {
            transform: translateX(-50%) scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Visor 3D con Realidad Aumentada Nativa activada ('ar') -->
    <model-viewer id="obj-viewer"
        src="Baseauto.glb"
        alt="Autito 3D"
        
        /* --- ESTOS SON LOS ATRIBUTOS MÁGICOS --- */
        ar                      /* Activa la Realidad Aumentada */
        ar-modes="webxr scene-viewer quick-look" /* Intenta WebXR primero, luego nativos */
        ar-scale="auto"         /* Mantiene la escala real del modelo */
        camera-controls         /* Permite girar el auto con el dedo antes de ponerlo en AR */
        touch-action="pan-y"    /* Mejora el scroll en móviles */
        shadow-intensity="1"    /* Sombra realista en el piso */
        bounds="tight">
        
        <!-- Botón que aparece solo cuando el navegador detecta capacidad AR -->
        <button slot="ar-button" id="ar-button">
            📍 Colocar en mi piso
        </button>

    </model-viewer>

</body>
</html>
