<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Autito AR - Piso Forzado</title>
    <!-- Cargamos model-viewer de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: sans-serif; }
        #container { position: relative; width: 100%; height: 100%; }
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        model-viewer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: transparent; z-index: 2; --poster-color: transparent; }
        #ar-button { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 16px 28px; font-size: 18px; font-weight: bold; color: white; background: linear-gradient(135deg, #007bff, #00d2ff); border: none; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; z-index: 100; display: none; /* Oculto hasta confirmar compatibilidad */ }
    </style>
</head>
<body>

    <div id="container">
        <!-- Feed de la Cámara -->
        <video id="camera-feed" autoplay playsinline muted></video>

        <!-- Visor 3D con AR Nativo FORZADO -->
        <model-viewer id="obj-viewer"
            src="Baseauto.glb"
            alt="Autito 3D"
            ar
            /* Eliminamos 'webxr' para forzar los modos nativos que detectan piso */
            ar-modes="scene-viewer quick-look" 
            ar-scale="auto"
            camera-controls
            shadow-intensity="1.5"
            bounds="tight">
            
            <button slot="ar-button" id="ar-button">
                📍 Poner en mi piso real
            </button>

        </model-viewer>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const viewer = document.getElementById('obj-viewer');
        const arButton = document.getElementById('ar-button');

        // 1. Mostrar botón solo si AR Nativo es compatible
        viewer.addEventListener('ar-status', (event) => {
            if (event.detail.status !== 'unsupported') {
                arButton.style.display = 'block';
            } else {
                alert("Tu celular o navegador no es compatible con AR de piso.");
            }
        });

        // 2. Iniciar Cámara de fondo
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" },
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error cámara:", err);
            }
        }

        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
