<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Autito AR - Cámara y Piso</title>
    <!-- Cargamos model-viewer de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 1. Fondo de la cámara siempre visible */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* 2. Capa 3D sobre la cámara (fondo transparente) */
        model-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            z-index: 2;
            --poster-color: transparent;
        }

        /* 3. Botón personalizado de AR */
        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #007bff, #00d2ff);
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 100;
        }

        #ar-button:active {
            transform: translateX(-50%) scale(0.96);
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- Feed de la Cámara (siempre abierto de fondo) -->
        <video id="camera-feed" autoplay playsinline muted></video>

        <!-- Visor 3D con AR Nativo activado ('ar') -->
        <model-viewer id="obj-viewer"
            src="Baseauto.glb"
            alt="Autito 3D"
            
            ar                      /* Activa AR */
            ar-modes="webxr scene-viewer quick-look" /* Intenta WebXR para usar cámara del HTML */
            ar-scale="auto"         /* Mantiene escala real */
            camera-controls         /* Permite girar el auto */
            touch-action="pan-y"    /* Scroll fluido */
            shadow-intensity="1.5"    /* Sombra realista */
            bounds="tight">
            
            <!-- Botón para ingresar al modo AR Nativo -->
            <button slot="ar-button" id="ar-button">
                📍 Colocar en mi piso
            </button>

        </model-viewer>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const viewer = document.getElementById('obj-viewer');

        // Iniciar Cámara Trasera siempre de fondo
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" },
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accediendo a la cámara:", err);
                // Si falla, el visor AR nativo aún podría funcionar
            }
        }

        // Arrancamos la cámara al cargar la página
        window.addEventListener('load', startCamera);

        // Opcional: Detener la cámara del HTML si se activa el modo AR nativo
        viewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
            } else if (event.detail.status === 'not-presenting') {
                startCamera();
                video.style.display = 'block';
            }
        });
    </script>
</body>
</html>
